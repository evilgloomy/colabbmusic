name: Cola Live Avatar Check

on:
  push:
    branches:
      - codex/cola-live-avatar
  pull_request:
    paths:
      - 'src/live/**'
      - 'supabase/functions/liveavatar-session/**'
      - 'supabase/functions/live-health/**'
      - '.github/workflows/cola-live-avatar-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test -- --runInBand
        continue-on-error: true
      - run: npm run build
