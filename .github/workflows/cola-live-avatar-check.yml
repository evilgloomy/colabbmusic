name: Shiba Digital Human Check
on:
  push:
    branches: [codex/cola-shiba-mvp]
  pull_request:
    paths:
      - 'src/live/**'
      - 'src/shiba/**'
      - 'src/test/**'
      - 'supabase/functions/**'
      - 'services/cola-avatar-engine/**'
      - '.github/workflows/cola-live-avatar-check.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.app.json
      - run: bun run test
      - run: bun run build
      - run: python3 services/cola-avatar-engine/tools/check_licenses.py
      - run: python3 services/cola-avatar-engine/tools/check_boundaries.py
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/cola-avatar-engine/requirements-test.txt
      - run: python -m pytest services/cola-avatar-engine/tests -q
