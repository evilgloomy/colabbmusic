name: Cola Live Avatar Check

on:
  push:
    branches:
      - codex/cola-live-avatar
  pull_request:
    paths:
      - 'src/live/**'
      - 'supabase/functions/liveavatar-session/**'
      - 'supabase/functions/live-health/**'
      - '.github/workflows/cola-live-avatar-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # This Lovable repo's npm package-lock is stale, while bun.lock is the
      # maintained dependency lock. Do not rewrite package-lock for this feature.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.app.json
      - run: bun run test
      - run: bun run build
