services:
  avatar:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/app/models:ro
      - ./avatar_packages:/app/avatar_packages:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # Use a routable host network or TURN for media. Signaling HTTP alone is insufficient.
